<!doctype html><html><head><meta charset="utf-8"><title>门店巡店整改</title></head><body><h1>门店巡店整改系统</h1><form><label>门店 <input id="store"></label><label>状态 <select id="status"><option value="">全部</option><option>open</option><option>assigned</option><option>submitted</option><option>closed</option></select></label><button type="button" onclick="load()">筛选</button></form><pre id="results"></pre><script>async function load(){const s=document.getElementById('store').value;const t=document.getElementById('status').value;const r=await fetch('/inspections?store='+encodeURIComponent(s)+'&status='+encodeURIComponent(t));document.getElementById('results').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
